name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore .\CopilotBuddy.slnx --nologo

      - name: Build
        run: dotnet build .\src\CopilotBuddy.Composition\CopilotBuddy.Composition.csproj -c Release --no-restore --nologo

      - name: Test
        run: dotnet test .\tests\CopilotBuddy.Core.Tests\CopilotBuddy.Core.Tests.csproj -c Release --no-restore --nologo

      - name: Publish executables
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
              throw "Release tag '${{ github.ref_name }}' does not contain a valid version."
          }

          foreach ($runtime in @('win-x64', 'win-arm64')) {
            $publish = ".\artifacts\publish\$runtime"
            dotnet publish `
              .\src\CopilotBuddy.Composition\CopilotBuddy.Composition.csproj `
              -c Release `
              -r $runtime `
              --self-contained true `
              --nologo `
              -p:Version=$version `
              -p:PublishSingleFile=true `
              -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:IncludeAllContentForSelfExtract=true `
              -p:DebugType=None `
              -p:DebugSymbols=false `
              -o $publish
            if ($LASTEXITCODE -ne 0) {
                throw "Publishing $runtime failed with exit code $LASTEXITCODE."
            }

            $source = Join-Path $publish 'CopilotBuddy.Composition.exe'
            $fileName = "CopilotBuddy-$runtime.exe"
            $target = Join-Path '.\artifacts' $fileName
            if (-not (Test-Path $source)) {
                throw "Published executable was not found at '$source'."
            }

            Move-Item $source $target
            $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $fileName" | Set-Content "$target.sha256"
          }

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arguments = @(
              'release',
              'create',
              '${{ github.ref_name }}',
              '.\artifacts\CopilotBuddy-win-x64.exe',
              '.\artifacts\CopilotBuddy-win-x64.exe.sha256',
              '.\artifacts\CopilotBuddy-win-arm64.exe',
              '.\artifacts\CopilotBuddy-win-arm64.exe.sha256',
              '--title',
              'Copilot Buddy ${{ github.ref_name }}',
              '--generate-notes',
              '--verify-tag'
          )
          if ('${{ github.ref_name }}'.Contains('-')) {
              $arguments += '--prerelease'
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
              throw "GitHub release creation failed with exit code $LASTEXITCODE."
          }
